<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>


    <!----Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    

</head>

<body>

    <div class="toast" id="toast">
        <div class="toast-body">
            <button id = "remove">❌</button>
            <h3>✓Message sent</h3>
            <p>Thanks for completing the Form, we will be in touch soon</p>
        </div>

    </div>

    <div class="container">
        <form id="form">
            <h1>Contact Us</h1>

            <div class="name-sec">
                <div class="row">
                    <label>First Name <span>*</span></label>
                    <input type="text" id="fname">
                    <small></small>
                </div>
                <div class="row">
                    <label>Last Name <span>*</span></label>
                    <input type="text" id="lname">
                    <small></small>
                </div>
            </div>

            <div class="email-sec">

                <div class="row">
                    <label>Email <span>*</span></label>
                    <input type="email" id="email">
                    <small></small>
                </div>

            </div>



            <!-- <div class="head" style="margin-bottom: 10px;">
                
            </div> -->


            <div class="query-sec">

                <label class="query-label">Query Type <span>*</span></label>

                <div class="query-options">
                    <div class="row">
                        <label class="option">
                            <input type="radio" name="query" id="ge">
                            General Enquiry

                        </label>
                    </div>

                    <div class="row">
                        <label class="option">
                            <input type="radio" name="query" id="sr">
                            Support Request
                        </label>
                    </div>
                </div>

                <small></small>

            </div>



            <div class="mes-sec">

                <div class="row">
                    <label for="message">Message <span>*</span></label>
                    <textarea id="message">
                    </textarea>
                    <small></small>
                </div>

            </div>


            <div class="check-sec">

                <div class="row">
                    <label class="checkbox">
                        <input id="check" type="checkbox" style="accent-color:  hsl(169, 67%, 28%); width: 20px;
                        height: 20px;">
                        I consent being contacted by the team <span>*</span>

                    </label>
                    <small></small>
                </div>

            </div>


            <div class="button">
                <button>
                    Submit
                </button>

            </div>


        </form>
    </div>

    <script src="script.js" defer></script>


</body>

</html>
